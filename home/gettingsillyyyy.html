<style>
/* Global styles */
body {
    background-color: transparent;
    color: #000;
    font-family: Arial, Helvetica, sans-serif; 
    margin: 0;
    padding: 0;
}

/* Main centralized container - 900px */
.site-container {
    max-width: 900px;
    margin: 0 auto;
    background-color: #transparent;
}

/* Header Area styling */
#header-area {
    padding: 10px 0;
    text-align: center;
    border-bottom: 2px solid #000;
}

/* Main Content Grid Structure */
.content-grid {
    display: grid;
    grid-template-columns: 2fr 1fr; /* 2-column layout */
    gap: 20px;
    padding: 20px;
}

/* Styling the generic modules */
.portal-module {
    border: 2px solid #000;
    padding: 20px;
    margin-bottom: 20px;
}

/* Styling module headers */
.portal-module h1 {
    background-color: #000;
    color: #fff;
    font-size: 1.1rem;
    padding: 8px 12px;
    text-transform: uppercase;
    margin: -20px -20px 20px -20px; /* Forces bleed to edge */
    font-family: 'IBM Plex Mono', monospace; 
}

/* Responsive adjustments for video content */
.video-container {
    position: relative;
    padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
    height: 0;
    overflow: hidden;
}

.video-container iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}

/* Typography styles inside modules */
.portal-module a { color: #000; font-weight: bold; text-decoration: underline; }
.portal-module p { line-height: 1.6; margin-bottom: 15px; }

/* Numbered list style for news */
.numbered-news ol { list-style-type: decimal; margin-left: 20px; padding-left: 0; }
.numbered-news li { font-weight: bold; margin-bottom: 10px; text-transform: uppercase; }

/* Add borders to all images inside modules */
.portal-module img { border: 1px solid #000; max-width: 100%; }

/* Footer styling */
.portal-footer {
    border-top: 1px solid #000;
    padding: 20px;
    margin-top: 20px;
    font-size: 10pt;
    text-align: center;
    font-family: verdana, arial, helvetica, sans-serif;
}

.portal-footer a { color: #000; text-decoration: underline; }

/* Media Queries for full responsiveness */
@media screen and (max-width: 768px) {
    .content-grid { grid-template-columns: 1fr; }
}
</style>
